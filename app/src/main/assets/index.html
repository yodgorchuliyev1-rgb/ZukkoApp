<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ZUKKO.UZ — Yozishni o‘yin bilan o‘rgan</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@700;900&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/canvas-confetti/1.9.3/confetti.browser.min.js"></script>
<style>
:root{--bg:#FFF7E0;--card:#fff;--ink:#1E1B4B;--line:#1E1B4B;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12102e;--card:#241f5c;--ink:#F5F3FF;--line:#0b0a1f}}
:root[data-theme="dark"]{--bg:#12102e;--card:#241f5c;--ink:#F5F3FF;--line:#0b0a1f}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Nunito,system-ui,sans-serif;font-weight:700;-webkit-tap-highlight-color:transparent}
h1,h2,h3,.fun{font-family:'Baloo 2',Nunito,sans-serif}
.card{background:var(--card);border:4px solid var(--line);border-radius:1.5rem;box-shadow:0 6px 0 var(--line),0 16px 28px rgba(30,27,75,.14)}
.btn{border:3px solid var(--line);border-radius:1rem;font-weight:900;padding:.6rem 1.1rem;box-shadow:0 5px 0 var(--line);transition:transform .12s,box-shadow .12s;color:#1E1B4B;cursor:pointer;min-height:48px}
.btn:hover{transform:scale(1.04)}.btn:active{transform:translateY(4px) scale(.94);box-shadow:0 1px 0 var(--line)}
.btn:focus-visible,.lbtn:focus-visible,input:focus-visible{outline:4px solid #EC4899;outline-offset:2px}
.lbtn{position:relative;aspect-ratio:1;border-radius:1.5rem;border:4px solid var(--line);background:var(--c);color:#fff;font:800 clamp(2rem,7vw,3.2rem) 'Baloo 2',sans-serif;box-shadow:0 8px 0 var(--line);transition:transform .12s,box-shadow .12s;text-shadow:0 3px 0 rgba(0,0,0,.25);cursor:pointer}
.lbtn:hover{transform:scale(1.05) rotate(-2deg)}.lbtn:active{transform:translateY(6px) scale(.95);box-shadow:0 2px 0 var(--line)}
.lbtn span{position:absolute;top:2px;right:6px;font-size:1.1rem;text-shadow:none}
.field{border:3px solid var(--line);border-radius:.8rem;padding:.4rem .6rem;background:var(--card);color:var(--ink);font-weight:800;width:5rem}
#heroImg{width:100%;aspect-ratio:714/1280;cursor:pointer;filter:drop-shadow(2px 0 0 #fff) drop-shadow(-2px 0 0 #fff) drop-shadow(0 2px 0 #fff) drop-shadow(0 -2px 0 #fff) drop-shadow(0 8px 10px rgba(30,27,75,.35));transition:transform .2s}
@media(min-width:1024px){#heroImg{width:min(250px,calc((100vh - 22rem)*.5578))}}
.talk #heroImg{animation:bob .45s ease-in-out infinite alternate}
@keyframes bob{to{transform:translateY(-6px) scale(1.02)}}
.wave{display:flex;gap:4px;height:22px;align-items:flex-end;justify-content:center;margin-top:6px;opacity:.25}.talk .wave{opacity:1}
.wave i{width:6px;height:5px;border-radius:4px;background:#EC4899}
.talk .wave i{animation:wv .5s ease-in-out infinite alternate}.wave i:nth-child(2){animation-delay:.1s!important;background:#0EA5E9}.wave i:nth-child(3){animation-delay:.2s!important;background:#F59E0B}.wave i:nth-child(4){animation-delay:.3s!important;background:#10B981}.wave i:nth-child(5){animation-delay:.15s!important}
@keyframes wv{to{height:22px}}
#bubble{background:#E0F2FE;color:#1E1B4B;border:4px solid var(--line);border-radius:1.5rem;padding:.7rem .9rem;position:relative;min-height:3.2rem;animation:bin .3s}
@keyframes bin{from{transform:scale(.85);opacity:0}}
@keyframes shake{20%,60%{transform:translateX(-10px)}40%,80%{transform:translateX(10px)}}.shake{animation:shake .4s}
@keyframes tst{0%{transform:translate(-50%,0) scale(.6);opacity:0}20%{opacity:1;transform:translate(-50%,0) scale(1.1)}100%{transform:translate(-50%,-70px);opacity:0}}
.toast{position:fixed;left:50%;top:30%;z-index:60;font:800 2.4rem 'Baloo 2';color:#F59E0B;-webkit-text-stroke:2px #1E1B4B;animation:tst 1.5s forwards;pointer-events:none}
.bump{animation:bin .3s}
@keyframes fill{from{width:0}to{width:100%}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><path id="meas"/></svg>
<header class="sticky top-0 z-30 bg-[var(--card)] border-b-4 border-[var(--line)]">
 <div class="max-w-6xl mx-auto px-3 py-2 flex items-center gap-2 flex-wrap">
  <button data-act="menu" class="fun text-2xl sm:text-3xl font-extrabold tracking-tight" aria-label="Bosh sahifa">✨<span class="text-[#0EA5E9]">ZUKKO</span><span class="text-[#EC4899]">.UZ</span></button>
  <div class="flex items-center gap-2 flex-wrap ml-auto">
   <span class="btn !cursor-default bg-[#F59E0B] !py-1" id="hudCoins">🪙 0</span>
   <span class="btn !cursor-default bg-[#FDBA74] !py-1" id="hudStreak">🔥 1 kun</span>
   <button data-act="stickers" class="btn bg-[#A7F3D0] !py-1" id="hudSt">🎖 0</button>
   <button data-act="hero" class="btn bg-white !py-1" id="hudHero" aria-label="Qahramonni almashtirish">👦</button>
   <button data-act="mute" class="btn bg-white !py-1" id="hudMute" aria-label="Ovoz">🔊</button>
   <button data-act="admin" class="btn bg-[#1E1B4B] !text-white !py-1">⚙️ Boshqaruv</button>
  </div>
 </div>
</header>
<div class="max-w-6xl mx-auto p-3 sm:p-5 grid lg:grid-cols-[270px_minmax(0,1fr)] gap-5 pb-56 lg:pb-5">
 <aside id="heroCol" class="fixed bottom-0 inset-x-0 z-20 flex items-end gap-2 px-3 pointer-events-none lg:sticky lg:top-24 lg:flex-col-reverse lg:items-stretch lg:self-start lg:px-0 lg:pointer-events-auto lg:z-10" style="padding-bottom:env(safe-area-inset-bottom,0px)">
  <div id="heroFig" class="pointer-events-auto w-[92px] shrink-0 lg:w-auto lg:flex lg:flex-col lg:items-center lg:mt-3"><img id="heroImg" alt="Qahramon" draggable="false"><div class="wave" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div></div>
  <div id="bubble" class="pointer-events-auto flex-1 mb-2 text-sm sm:text-base lg:flex-none" aria-live="polite"></div>
 </aside>
 <div class="min-w-0"><nav id="cats" class="flex gap-2 overflow-x-auto pb-3 -mx-1 px-1"></nav><main id="main"></main></div>
</div>

/* O‘ va G‘ = harf + yuqoridagi tutuq belgisi; Sh, Ch, Ng = ikki harf yonma-yon (torroq) */
function glyphD(k){
  if(G[k])return G[k].split('|').map(d=>({d,a:1,b:0}));
  if(k.endsWith('‘'))return [...glyphD(k[0]),{d:'M82 8L74 24',a:1,b:0}];

}

/* AudioManager: audio fayl -> (xato bo‘lsa) Web Speech -> (u ham bo‘lmasa) faqat matn */
const AudioManager={
  cur:null,timer:null,typer:null,
  play(path,text){
    this.stop();this.type(text);this.talk(true);
    let used=false;const fb=()=>{if(used)return;used=true;this.tts(text)};
    if(S.mute){this.endLater(text);return}
    if(!path){fb();return}
    try{const a=new Audio(path);this.cur=a;a.addEventListener('error',fb,{once:true});a.addEventListener('ended',()=>this.talk(false),{once:true});const p=a.play();if(p&&p.catch)p.catch(fb)}catch(e){fb()}
  },
  tts(text){
    this.endLater(text);
    try{if(!window.speechSynthesis||S.mute)return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='uz-UZ';u.pitch=S.hero==='girl'?1.6:1.3;u.rate=.9;
      const v=speechSynthesis.getVoices().find(v=>/^uz/i.test(v.lang));if(v)u.voice=v;speechSynthesis.speak(u)}catch(e){}
  },
  endLater(text){clearTimeout(this.timer);this.timer=setTimeout(()=>this.talk(false),Math.max(1200,text.length*70))},
  stop(){clearTimeout(this.timer);if(this.cur){try{this.cur.pause()}catch(e){}this.cur=null}try{window.speechSynthesis&&speechSynthesis.cancel()}catch(e){}},
  talk(on){$('#heroCol').classList.toggle('talk',on)},

function loop(t){if(!L||L.dead)return;draw(t);L.raf=requestAnimationFrame(loop)}
function pos(e){const r=L.cv.getBoundingClientRect();return{x:(e.clientX-r.left)/r.width*100,y:(e.clientY-r.top)/r.height*100}}

function onDown(e){
  if(L.done)return;e.preventDefault();try{L.cv.setPointerCapture(e.pointerId)}catch(x){}
  const p=pos(e),s=L.strokes[L.si];
  if(dist(p,s.pts[L.prog])>16){if(performance.now()-L.hint>3500){L.hint=performance.now();AudioManager.type('Yashil nuqtadan boshlaymiz!')}return}
  L.drawing=true;L.off=0;sfx('pop');
}
function onMove(e){
  if(!L.drawing||L.done)return;const p=pos(e),s=L.strokes[L.si],now=performance.now();
  L.trail.push({...p,t:now});
  let best=-1,bd=1e9;for(let i=L.prog;i<Math.min(s.pts.length,L.prog+14);i++){const d=dist(p,s.pts[i]);if(d<bd){bd=d;best=i}}
  if(bd<10){if(best>L.prog){L.prog=best;spawn(p);if(best%3===0)sfx('spark')}L.off=0}
  else{let md=1e9;for(const q of s.pts)md=Math.min(md,dist(p,q));if(md>18){if(++L.off>6)return fail()}else L.off=Math.max(0,L.off-1)}
  if(L.prog>=s.pts.length-2){L.si++;L.prog=0;L.drawing=false;sfx('ok');if(L.si>=L.strokes.length)complete()}
}
function spawn(p){for(let i=0;i<2;i++)L.parts.push({x:p.x,y:p.y,vx:(Math.random()-.5)*.9,vy:(Math.random()-.5)*.9-.3,l:1,s:12+Math.random()*14,c:pick(PAL)})}
function fail(){
  L.drawing=false;L.prog=0;L.trail=[];S.failsTotal++;S.fails[L.l.key]=(S.fails[L.l.key]||0)+1;save();

}
/* Mukofot: tanga + (har 3 ta to‘g‘ridan keyin) stiker; konfetti; "Keyingisi" tugmasi */

function draw(t){
  const c=L.cx;c.clearRect(0,0,W,W);c.lineCap=c.lineJoin='round';
  const P=(pts,n)=>{c.beginPath();pts.slice(0,n).forEach((q,i)=>i?c.lineTo(q.x*K,q.y*K):c.moveTo(q.x*K,q.y*K))};
  L.strokes.forEach((s,i)=>{
    c.setLineDash([]);P(s.pts);c.lineWidth=48;c.strokeStyle='rgba(30,27,75,.09)';c.stroke();           // kontur
    if(i>=L.si){c.setLineDash([2,16]);c.lineWidth=5;c.strokeStyle='rgba(30,27,75,.35)';P(s.pts);c.stroke();c.setLineDash([]);   // yo‘l
      c.fillStyle='rgba(30,27,75,.4)';for(let k=10;k<s.pts.length-1;k+=12){const a=s.pts[k],b=s.pts[k+1];c.save();c.translate(a.x*K,a.y*K);c.rotate(Math.atan2(b.y-a.y,b.x-a.x));c.beginPath();c.moveTo(11,0);c.lineTo(-7,-8);c.lineTo(-7,8);c.fill();c.restore()}} // strelkalar
  });
  c.setLineDash([]);
  L.strokes.forEach((s,i)=>{const n=i<L.si?s.pts.length:i===L.si?L.prog+1:0;if(n>1){P(s.pts,n);c.lineWidth=30;c.strokeStyle=c.shadowColor=PAL[i%4];c.shadowBlur=14;c.stroke();c.shadowBlur=0}});
  L.strokes.forEach((s,i)=>{ // boshlanish nuqtalari
    if(i<L.si||(i===L.si&&L.drawing&&L.prog>0))return;const cur=i===L.si,p=s.pts[cur?L.prog:0];
    c.beginPath();c.arc(p.x*K,p.y*K,16+(cur?4*Math.sin(t/180):0),0,7);c.fillStyle=cur?'#10B981':'#94a3b8';c.fill();c.lineWidth=4;c.strokeStyle='#fff';c.stroke();
    if(L.strokes.length>1){c.fillStyle='#fff';c.font='900 18px Nunito';c.textAlign='center';c.textBaseline='middle';c.fillText(i+1,p.x*K,p.y*K+1)}});
  const now=performance.now();L.trail=L.trail.filter(q=>now-q.t<450);
  L.trail.forEach(q=>{c.globalAlpha=1-(now-q.t)/450;c.fillStyle='#F59E0B';c.beginPath();c.arc(q.x*K,q.y*K,7,0,7);c.fill()});
  L.parts=L.parts.filter(q=>q.l>0);c.textAlign='center';c.textBaseline='middle';
  L.parts.forEach(q=>{q.x+=q.vx;q.y+=q.vy;q.l-=.025;c.globalAlpha=Math.max(0,q.l);c.fillStyle=q.c;c.font=q.s+'px sans-serif';c.fillText('★',q.x*K,q.y*K)});
  c.globalAlpha=1;
}

/* ---------- 6) EKRANLAR ---------- */
const enabled=()=>LESSONS.filter(l=>!S.off[l.key]);
const TITLES={harf:'Harflarni yozamiz',num:'Sonlarni yozamiz',misol:'Misollar yechamiz',soz:'Gap tuzamiz'};
function renderCats(){$('#cats').innerHTML=CATS.map(([k,i,t],n)=>`<button data-cat="${k}" class="btn shrink-0 text-lg ${cat===k?'!text-white':'bg-white'}" style="${cat===k?'background:'+PAL[n%4]:''}">${i} ${t}</button>`).join('')}
function menu(){
  stopLoop();if(!TITLES[cat])cat='harf';renderCats();
  const list=enabled().filter(l=>l.type===cat),dn=list.filter(l=>S.done[l.key]).length,sm=cat==='misol'||cat==='soz';
  $('#main').innerHTML=`<div class="card p-4 mb-4"><h2 class="fun text-3xl font-extrabold">${TITLES[cat]}</h2><p>Bajarilgan: ${dn}/${list.length}</p></div><div class="grid ${sm?'grid-cols-2 sm:grid-cols-3':'grid-cols-3 sm:grid-cols-4 md:grid-cols-5'} gap-3 sm:gap-4">${list.map((l,i)=>`<button data-k="${l.key}" class="lbtn" style="--c:${PAL[i%4]};${sm?'aspect-ratio:auto;padding:1.1rem .5rem;font-size:clamp(1.3rem,4vw,2rem)':''}">${l.title}${S.done[l.key]?'<span>✅</span>':''}</button>`).join('')}</div>`;
}
function stickers(){
  stopLoop();const left=3-(S.correct%3);
  $('#main').innerHTML=`<div class="card p-4 mb-4"><h2 class="fun text-3xl font-extrabold">Mening stikerlarim</h2><p>Keyingi stikergacha yana ${left} ta to‘g‘ri yozuv qoldi.</p></div><div class="grid grid-cols-3 sm:grid-cols-4 md:grid-cols-6 gap-3">${STICKERS.map(s=>S.stickers.includes(s)?`<div class="card p-4 text-center text-5xl">${s}</div>`:`<div class="card p-4 text-center text-5xl opacity-40">❔</div>`).join('')}</div>`;
}
function admin(){
  stopLoop();const dn=LESSONS.filter(l=>S.done[l.key]).length,tot=S.tries+S.failsTotal,acc=tot?Math.round(100*S.tries/tot):100;
  const top=Object.entries(S.fails).sort((a,b)=>b[1]-a[1]).slice(0,5),mx=top[0]?top[0][1]:1;
  const M=[['O‘rganilgan darslar',dn+'/'+LESSONS.length,'#0EA5E9'],['To‘g‘ri yozuvlar',S.tries,'#10B981'],['Aniqlik',acc+'%','#EC4899'],['Tangalar / Kun ketma-ketligi',S.coins+' / '+S.streak,'#F59E0B']];
  $('#main').innerHTML=`<h2 class="fun text-3xl font-extrabold mb-3">Boshqaruv paneli</h2>
  <div class="grid grid-cols-2 lg:grid-cols-4 gap-3">${M.map(m=>`<div class="card p-4" style="border-color:${m[2]}"><div class="fun text-3xl font-extrabold" style="color:${m[2]}">${m[1]}</div><div class="text-sm">${m[0]}</div></div>`).join('')}</div>
  <div class="card p-4 mt-4"><h3 class="fun text-xl font-extrabold mb-2">Eng ko‘p xato qilinayotgan mavzular</h3>${top.length?top.map(([k,v])=>`<div class="flex items-center gap-3 mb-2"><span class="fun text-2xl w-12">${k}</span><div class="flex-1 h-5 rounded-full bg-[#1E1B4B]/10 overflow-hidden"><div class="h-full bg-[#EC4899]" style="width:${100*v/mx}%"></div></div><span class="w-8 text-right">${v}</span></div>`).join(''):'<p>Hozircha xatolar yo‘q. Barakalla!</p>'}</div>
  <div class="card p-4 mt-4"><h3 class="fun text-xl font-extrabold mb-2">Darslar va mukofotlar</h3><div class="max-h-96 overflow-auto"><table class="w-full text-left"><thead><tr class="border-b-4 border-[var(--line)]"><th class="p-2">Dars</th><th class="p-2">Faol</th><th class="p-2">Tanga</th><th class="p-2">Holat</th></tr></thead><tbody>${LESSONS.map(l=>`<tr class="border-b-2 border-[var(--line)]/20"><td class="p-2 fun text-xl">${l.title}</td><td class="p-2"><input type="checkbox" class="w-6 h-6" data-en="${l.key}" ${S.off[l.key]?'':'checked'}></td><td class="p-2"><input type="number" min="0" max="99" class="field" data-rw="${l.key}" value="${reward(l)}"></td><td class="p-2">${S.done[l.key]?'✅':'—'}</td></tr>`).join('')}</tbody></table></div>
  <button data-act="reset" class="btn bg-[#EC4899] !text-white mt-4">Jarayonni tozalash</button></div>`;
}
function next(){clearTimeout(AUTO);const list=enabled().filter(l=>l.type===CURT),n=list[list.findIndex(l=>l.key===CURK)+1];if(n)openAny(n.key);else{menu();say('correct')}}

/* ---------- Hodisalar ---------- */
document.addEventListener('click',e=>{
  if(e.target.closest('button'))sfx('pop');
  const c=e.target.closest('[data-cat]');if(c){cat=c.dataset.cat;renderCats();return cat==='stickers'?stickers():menu()}
  const k=e.target.closest('[data-k]');if(k)return openAny(k.dataset.k);
  const a=e.target.closest('[data-act]');if(!a)return;
  ({menu,next,
    stickers:()=>{cat='stickers';renderCats();stickers()},admin:()=>{cat='';renderCats();admin()},
    retry:()=>RETRY&&RETRY(),hear:()=>HEAR&&HEAR(),
    mute:()=>{S.mute=!S.mute;save();hud();if(S.mute)AudioManager.stop()},
    hero:()=>{S.hero=S.hero==='boy'?'girl':'boy';save();hud();say('welcome')},
    reset:()=>{const h=S.hero;S=defaults();S.hero=h;S.last=ymd(new Date());S.streak=1;save();hud();admin();toast('Tozalandi')}
  })[a.dataset.act]?.();
});
document.addEventListener('change',e=>{
  const r=e.target.dataset.rw,n=e.target.dataset.en;
  if(r){S.rewards[r]=Math.max(0,Math.min(99,+e.target.value||0));save()}
  if(n){S.off[n]=!e.target.checked;save()}
});
$('#heroImg').addEventListener('click',()=>{const h=S.hero;AudioManager.play(null,pick(SAY[h].correct))});
document.addEventListener('pointerdown',()=>{try{ac()}catch(e){}},{once:true});
document.addEventListener('pointerdown',()=>say('welcome'),{once:true});

hud();menu();AudioManager.type(SAY[S.hero].welcome);
</script>
</body>
